    <style>
    :root{
    --cream:#f5f7f3; --paper:#fffefd; --ink:#1d2024; --olive:#5b9d88; --olive2:#8fd8bf;
    --sage:#d9f1e7; --blush:#f0d8e6; --rose:#c52f69; --gold:#c28a42; --gold2:#e8bd68;
    --coral:#164f49; --teal:#277d70; --lavender:#d9d2ed;
    --line:#cbd8d1; --dark:#111418; --muted:#68716d; --white:#fff;
    --shadow:0 18px 55px rgba(0,0,0,.3); --radius:24px;
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:16px}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    img{max-width:100%;display:block}
    a{text-decoration:none;color:inherit}
    .wrap{width:min(1180px,calc(100% - 40px));margin:auto}
    .topbar{background:var(--dark);color:var(--olive2);font-size:12px;letter-spacing:.12em;text-align:center;padding:9px}
    .site-header{position:sticky;top:0;z-index:50;background:rgba(255,254,253,.96);backdrop-filter:blur(18px);border-bottom:2px solid var(--olive2)}
    .site-header .wrap{width:100%;max-width:none;padding:0 30px}
    .header-row{min-height:78px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:30px}
    .header-row .brand{justify-self:start}
    .brand{display:flex;align-items:center;gap:12px;cursor:pointer}
    .brand-mark{width:58px;height:58px;object-fit:cover;border:2px solid var(--ink);border-radius:50%;background:var(--sage);box-shadow:0 4px 14px rgba(29,32,36,.16)}
    .brand-copy strong{display:block;font:600 34px/1 "Cormorant Garamond",serif;letter-spacing:.01em}
    .brand-copy span{display:block;font-size:10px;letter-spacing:.36em;margin-top:5px;color:var(--olive)}
    .nav{display:flex;justify-content:center;gap:clamp(22px,3.5vw,48px);align-items:center;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
    .header-row .nav{justify-self:stretch}
    .nav a{cursor:pointer}
    .nav a:hover,.nav a.active{color:var(--rose)}
    .header-actions{display:flex;align-items:center;gap:10px}
    .header-row .header-actions{justify-self:end}
    .cart-text{border:2px solid var(--teal);background:var(--sage);color:var(--ink);font-size:14px;font-weight:700;padding:0;border-radius:999px;transition:.2s;width:112px;height:44px;display:inline-flex;align-items:center;justify-content:center}
    .cart-text:hover{background:var(--teal);color:#fff;transform:translateY(-2px)}
    .icon-btn{border:1px solid var(--line);background:var(--paper);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
    .cart-badge{position:absolute;margin:-30px 0 0 25px;background:var(--rose);color:white;border-radius:99px;font-size:10px;min-width:19px;height:19px;display:grid;place-items:center}
    .btn{border:0;border-radius:999px;padding:13px 20px;font-weight:700;letter-spacing:.03em;transition:.2s}
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{background:var(--teal);color:white;box-shadow:0 9px 22px rgba(40,127,123,.25)}
    .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff}
    .btn-soft{background:var(--sage);color:var(--teal)}
    .btn-outline{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.9);color:#fff}
    .btn-danger{background:#8f4b45;color:#fff}
    .btn-book{background:var(--coral);color:#fff;box-shadow:0 9px 22px rgba(22,79,73,.28)}
    .header-actions .btn-book{width:112px;height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0}
    .hamb{display:none}

    .hero{min-height:690px;position:relative;overflow:hidden;background:
    linear-gradient(110deg,rgba(0, 0, 0, 0.15),rgba(91,157,136,.10) 48%,rgba(240,216,230,.12)),
    url("https://t4.ftcdn.net/jpg/06/13/51/75/360_F_613517595_vN9ugH0PW0vnPTzINEX1Eqnqt1EAlB0c.jpg") center/cover;animation:hero-pan 14s ease-in-out infinite alternate}
    .hero:before{content:"";position:absolute;inset:-12%;background:linear-gradient(125deg,rgba(143,216,191,.08),transparent 42%,rgba(240,216,230,.06) 72%,rgba(22,79,73,.06));animation:hero-glow 9s ease-in-out infinite alternate;pointer-events:none}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 78%,rgba(14,45,42,.12))}
    .hero-inner{position:relative;z-index:2;min-height:690px;display:flex;align-items:center}
    .hero-copy{width:min(650px);color:white;padding:60px 0;animation:hero-copy-in 1s ease-out both}
    .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.28em;color:var(--gold2);font-weight:700}
.hero h1{font:600 clamp(58px,8vw,104px)/.82 "Cormorant Garamond",serif;margin:22px 0;animation:hero-title-reveal 1.05s .16s cubic-bezier(.2,.75,.25,1) both}
.hero h1 em{font-family:"Italianno",cursive;font-style:normal;color:#e5cfa0;font-size:.68em;display:inline-block;animation:hero-ampersand-glow 3.8s 1.2s ease-in-out infinite}
    .hero p{max-width:560px;font-size:19px;line-height:1.85;color:#f6f0e6}
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;animation:hero-rise .8s .45s ease-out both}
    .hero-actions .btn{animation:button-float 3.5s 1.4s ease-in-out infinite}
    .hero-actions .btn:nth-child(2){animation-delay:1.7s}
    .hero .btn-primary{background:#fff;color:var(--ink)}
    .hero-note{display:flex;gap:20px;flex-wrap:wrap;margin-top:35px;font-size:12px;letter-spacing:.08em;color:#eee7d8}
    .hero-note span{display:flex;gap:8px;align-items:center}.hero-note{animation:hero-rise .8s .7s ease-out both}.dot{width:6px;height:6px;border-radius:50%;background:var(--gold2);animation:dot-pulse 2s ease-in-out infinite}
@keyframes hero-copy-in{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes hero-title-reveal{from{opacity:0;transform:translateY(38px);letter-spacing:.1em;filter:blur(7px)}to{opacity:1;transform:translateY(0);letter-spacing:normal;filter:blur(0)}}
@keyframes hero-ampersand-glow{0%,100%{transform:translateY(0) rotate(-2deg);text-shadow:0 0 0 rgba(232,189,104,0)}50%{transform:translateY(-5px) rotate(2deg);text-shadow:0 0 22px rgba(232,189,104,.7)}}
@keyframes booking-ambient-one{from{transform:translate3d(-4%,-2%,0) scale(1)}to{transform:translate3d(22%,18%,0) scale(1.22)}}
@keyframes booking-ambient-two{from{transform:translate3d(3%,3%,0) scale(1.05)}to{transform:translate3d(-20%,-16%,0) scale(1.25)}}
    @keyframes hero-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes button-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes dot-pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,195,109,.35)}50%{box-shadow:0 0 0 7px rgba(242,195,109,0)}}
    @keyframes hero-pan{from{background-position:48% 50%;}to{background-position:54% 46%;}}
    @keyframes hero-glow{from{transform:translate3d(-2%,0,0) scale(1);}to{transform:translate3d(2%,1%,0) scale(1.05);}}

    .section{padding:90px 0}.section-head{text-align:center;max-width:760px;margin:0 auto 45px}
    .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.28em;color:var(--rose);font-weight:800}
    .section h2{font:600 clamp(44px,5.6vw,70px)/.96 "Cormorant Garamond",serif;margin:14px 0 18px;letter-spacing:-.015em}
    .section-head p{color:var(--muted);line-height:1.85;margin:0;font-size:17px}
    .feature-grid{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:18px}
    .feature{position:relative;min-height:310px;border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
    .feature img{width:100%;height:100%;object-fit:cover;transition:.5s}.feature:hover img{transform:scale(1.05)}
    .feature:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(18,28,18,.78))}
    .feature-content{position:absolute;z-index:2;left:25px;right:25px;bottom:23px;color:white}
    .feature-content h3{font:600 34px "Cormorant Garamond",serif;margin:0 0 6px}.feature-content p{font-size:12px;opacity:.9}

    .brand-strip{background:var(--ink);color:#eee8d8;padding:24px 0}.brand-strip .wrap{display:flex;justify-content:center;gap:35px;flex-wrap:wrap;letter-spacing:.22em;font-size:11px;text-transform:uppercase}.brand-strip span:before{content:"✦";color:var(--gold2);margin-right:10px}

    .services-section{background:linear-gradient(135deg,#e9f7f1 0%,#f7f4f0 52%,#f5e4ed 100%)}
    .filterbar{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-bottom:32px}
    .filter{padding:11px 17px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--muted);font-weight:600}
    .filter.active{background:var(--coral);color:white;border-color:var(--coral)}
    .service-grid{display:grid;grid-template-columns:repeat(3,minmax(280px,360px));justify-content:center;gap:22px;width:100%}
    .inner-page-wrap{width:calc(100% - 32px);max-width:none}
    .service-card{position:relative;background:var(--ink);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:430px;box-shadow:0 8px 28px rgba(44,52,37,.06);transition:.25s}
    .service-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
    .service-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#f4f0e5;transition:.5s}
    .service-card:hover .service-image{transform:scale(1.04)}
    .service-card:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 28%,rgba(0,0,0,.88) 100%);pointer-events:none}
    .service-card-body{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;flex:1;min-height:430px;padding:24px 18px 18px;color:#fff}
    .service-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
    .service-card h3{font:600 27px/1.02 "Cormorant Garamond",serif;margin:13px 0 7px;color:#fff}
    .service-card p{font-size:13px;color:#f2eee4;line-height:1.58;margin:0 0 12px}
    .service-price{font-weight:800;font-size:20px;color:#f3d99d}
    .service-price small{font-size:10px;font-weight:600;color:#f2eee4}
    .service-actions .btn-primary{background:var(--coral);box-shadow:0 8px 18px rgba(22,79,73,.28)}
    .service-actions{display:flex;gap:8px;margin-top:12px}.service-actions .btn{padding:10px 13px;font-size:12px;flex:1}

    .catalog-banner{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
    .catalog-banner img{height:430px;width:100%;object-fit:cover;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow)}
    .catalog-note{grid-column:1/-1;text-align:center;color:var(--muted);font-size:12px}

    .service-showcase{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:38px}.service-showcase-card{position:relative;min-height:170px;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 30px rgba(44,52,37,.08);cursor:pointer}.service-showcase-card img{width:100%;height:100%;object-fit:cover;transition:.45s}.service-showcase-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,32,24,.03),rgba(24,32,24,.82))}.service-showcase-card:hover img{transform:scale(1.06)}.service-showcase-copy{position:absolute;z-index:2;left:18px;right:18px;bottom:16px;color:#fff}.service-showcase-copy h3{font:600 27px/1 "Cormorant Garamond",serif;margin:0 0 4px}.service-showcase-copy span{font-size:11px;letter-spacing:.08em;opacity:.88}.service-more{display:flex;justify-content:center;margin-top:28px}.color-band{background:linear-gradient(110deg,#253b52 0%,#543456 48%,#6a3d46 100%);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .about{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;background:linear-gradient(135deg,#e1f5ec,#f3e5ed);}
    .about-photo{position:relative}.about-photo img{height:600px;width:100%;object-fit:cover;border-radius:30px;box-shadow:var(--shadow)}
    .about-photo .floating{position:absolute;right:-25px;bottom:30px;background:#fffdf8;border:1px solid var(--line);padding:20px 24px;border-radius:20px;box-shadow:var(--shadow)}
    .about h2{text-align:left}.about-copy p{line-height:1.85;color:var(--muted)}
    .about-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}.about-list div{padding:14px;background:#fff;border:1px solid var(--line);border-radius:15px;font-size:13px}.about-list b{display:block;color:var(--olive);margin-bottom:4px}

    .gallery{display:grid;grid-template-columns:1.2fr .8fr .8fr;grid-auto-rows:220px;gap:14px}
    .gallery img{width:100%;height:100%;object-fit:cover;border-radius:20px}.gallery .tall{grid-row:span 2}.gallery .wide{grid-column:span 2}

    .contact{background:var(--dark);color:#fff}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}.contact .section-head{text-align:left;margin:0}.contact p{color:#d4ddd8}.contact-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.contact-card{padding:18px;border:1px solid rgba(143,216,191,.28);border-radius:18px;background:rgba(143,216,191,.08)}.contact-card small{color:var(--olive2);display:block;margin-bottom:5px}.contact-card a{color:var(--blush)}
    .contact-form{margin-top:28px}.contact-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.contact-form .field{margin:0 0 12px}.contact-form .field label{color:var(--olive2)}.contact-form input,.contact-form select,.contact-form textarea{background:rgba(255,255,255,.96);color:var(--ink);border:1px solid var(--olive2)}.contact-form button{margin-top:6px}
    .map-card{min-height:460px;border-radius:26px;overflow:hidden;background:var(--sage);position:relative;border:1px solid rgba(22,79,73,.2);box-shadow:0 16px 40px rgba(31,71,62,.14)}.map-card iframe{width:100%;height:100%;min-height:460px;border:0;display:block}.map-overlay{position:absolute;left:18px;right:18px;bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:15px;background:rgba(255,255,255,.94);color:var(--ink);box-shadow:0 10px 28px rgba(0,0,0,.18)}.map-overlay small{display:block;color:var(--muted);margin-top:3px}.map-overlay .btn{padding:10px 14px;font-size:12px;white-space:nowrap}

    body.home{background:linear-gradient(145deg,#f5f7f3 0%,#e8f6ef 48%,#f5e6ed 100%)}
    body.home>.section{position:relative;overflow:hidden}
    body.home>.section:nth-of-type(2){background:linear-gradient(135deg,#f8fbf8 0%,#dff4e9 48%,#f4e3eb 100%)}
    body.home>#about{background:linear-gradient(120deg,#dff5eb 0%,#f5f8f4 50%,#f4dce7 100%)}
    body.home>#gallery{background:linear-gradient(135deg,#f5f8f4 0%,#f6e0e8 48%,#dff3ea 100%)}
    body.home .about{background:transparent}
    body.home .section-head p{color:#48566f}
    body.home .brand-strip{background:linear-gradient(90deg,#20302b,#5b9d88,#c52f69)}
    .color-band{background:linear-gradient(110deg,#ccefe0 0%,#f3e4ec 52%,#dff4ec 100%)}
    .map-card{background-color:var(--sage)}
    .service-more .btn-gold{background:var(--coral);color:#fff;box-shadow:0 9px 22px rgba(22,79,73,.28)}

    .contact-links{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.contact-links h3{grid-column:1/-1;margin:0;color:var(--olive2);font:600 27px "Cormorant Garamond",serif}.contact-links a,.contact-links button{color:#fff;background:transparent;border:0;text-align:left;font-size:14px;padding:0}.contact-links a:hover,.contact-links button:hover{color:var(--olive2)}
    footer{padding:38px 0;background:var(--dark);color:#d4ddd8;font-size:14px}footer .wrap{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:28px;align-items:start}footer strong{display:block;color:var(--olive2);font:600 26px "Cormorant Garamond",serif;margin-bottom:10px}footer span,footer a{line-height:1.8}footer .footer-categories{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}footer .footer-categories a:hover{color:var(--rose)}

    .overlay{position:fixed;inset:0;background:rgba(15,21,15,.58);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
    .modal{background:var(--paper);width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:26px;box-shadow:0 30px 100px rgba(0,0,0,.3);padding:30px;position:relative}
    .close{position:absolute;right:18px;top:18px;border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:50%}
    .modal h2{font:600 42px "Cormorant Garamond",serif;margin:0 0 8px}.modal .muted{color:var(--muted);line-height:1.7}
    .detail-price{font-size:28px;color:var(--olive);font-weight:800;margin:20px 0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:12px 0}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--olive)}
.booking-page{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,#f7fbf8 0%,#e3f2eb 52%,#f7efe2 100%)}.booking-page:before,.booking-page:after{content:"";position:absolute;z-index:-1;width:46vw;height:46vw;min-width:360px;min-height:360px;border-radius:50%;filter:blur(28px);opacity:.46;pointer-events:none}.booking-page:before{top:-18vw;left:-12vw;background:radial-gradient(circle,rgba(112,201,169,.62) 0%,rgba(112,201,169,0) 68%);animation:booking-ambient-one 17s ease-in-out infinite alternate}.booking-page:after{right:-14vw;bottom:-22vw;background:radial-gradient(circle,rgba(230,178,115,.5) 0%,rgba(240,216,230,.12) 44%,rgba(240,216,230,0) 72%);animation:booking-ambient-two 21s ease-in-out infinite alternate}.booking-page .wrap{position:relative;z-index:1}.booking-card{padding:30px;border:1px solid rgba(22,79,73,.15);border-radius:26px;background:rgba(255,255,255,.88);box-shadow:0 16px 42px rgba(29,78,67,.1)}.booking-card h3{font:600 32px "Cormorant Garamond",serif;margin:0 0 7px}.booking-card p{margin:0 0 22px;color:var(--muted);font-size:14px}.booking-date-input{width:100%;padding:15px 16px;border:1px solid #abcfc1;border-radius:14px;background:#f9fdfb;color:var(--ink);font-weight:700;outline:none}.booking-date-input:focus{border-color:var(--coral);box-shadow:0 0 0 4px rgba(22,79,73,.12)}.booking-time-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}.booking-time-title h3{margin:0}.booking-time-title span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:800}.booking-times{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.booking-times .filter{padding:12px 8px;border-color:#c5ddd2;background:#fff}.booking-times .filter:disabled{opacity:.42;cursor:not-allowed}.booking-times .filter.active{background:var(--coral);border-color:var(--coral);box-shadow:0 8px 16px rgba(22,79,73,.22)}.booking-summary{padding:30px;border-radius:26px;background: const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

async function loadCloudData(){
  try{
    // Public visitors can read services/categories. Bookings are private
    // and are only queried after an authenticated Admin/Staff session exists.
    const [s,c]=await Promise.all([
      supabaseClient.from("services").select("*").order("id"),
      supabaseClient.from("categories").select("*").order("id")
    ]);
    if(s.error)throw s.error;
    if(c.error)throw c.error;

    if(s.data?.length){
      services.splice(0,services.length,...s.data.map(x=>({
        id:Number(x.id),cat:x.category,name:x.name,price:Number(x.price),
        duration:Number(x.duration),desc:x.description||"",image:x.image||""
      })));
    }else if(isFullAdmin()){
      const {error}=await supabaseClient.from("services").upsert(services.map(x=>({
        id:Number(x.id),name:x.name,category:x.cat,price:Number(x.price),
        duration:Number(x.duration),description:x.desc||"",image:x.image||""
      })),{onConflict:"id"});
      if(error)console.error("Initial service sync failed",error);
    }

    if(c.data?.length){
      cats.splice(0,cats.length,"All",...c.data.map(x=>x.name));
    }else if(isFullAdmin()){
      const rows=cats.slice(1).map(name=>({name}));
      if(rows.length){
        const {error}=await supabaseClient.from("categories").upsert(rows,{onConflict:"name"});
        if(error)console.error("Initial category sync failed",error);
      }
    }

    // Never request private bookings from the public/anonymous session.
    if(isFullAdmin() || state.user?.role==="staff"){
      const {data:b,error:bError}=await supabaseClient
        .from("bookings").select("*").order("created_at",{ascending:false});
      if(bError)throw bError;
      bookings.splice(0,bookings.length,...(b||[]).map(x=>({
        id:x.id,name:x.name,phone:x.phone,email:x.email||"",date:x.booking_date,
        time:x.booking_time,services:x.services||[],amount:Number(x.amount||0),
        notes:x.notes||"",status:x.status||"Pending"
      })));
      localStorage.setItem("blushBookings",JSON.stringify(bookings));
    }

    localStorage.setItem("blushServices",JSON.stringify(services));
    localStorage.setItem("blushCategories",JSON.stringify(cats.slice(1)));
  }catch(e){
    console.error("Supabase load failed",e);
    toast("Cloud connection failed");
  }
}

async function cloudSaveServices(){
  const {error}=await supabaseClient.from("services").upsert(services.map(x=>({
    id:Number(x.id),name:x.name,category:x.cat,price:Number(x.price),
    duration:Number(x.duration),description:x.desc||"",image:x.image||""
  })),{onConflict:"id"});
  if(error)console.error("Service cloud save failed",error);
}

async function cloudSaveCategories(){
  const rows=cats.slice(1).map(name=>({name}));
  if(rows.length){
    const {error}=await supabaseClient.from("categories").upsert(rows,{onConflict:"name"});
    if(error)console.error("Category cloud save failed",error);
  }
}

async function cloudSaveBooking(x){
  // Customer bookings are created with INSERT only. Anonymous customers
  // must never receive UPDATE permission just to support an upsert.
  const {error}=await supabaseClient.from("bookings").insert({
    id:String(x.id),name:x.name,phone:x.phone,email:x.email||"",
    booking_date:x.date,booking_time:x.time,services:x.services||[],
    amount:Number(x.amount||0),notes:x.notes||"",status:x.status||"Pending"
  });
  if(error)console.error("Booking cloud save failed",error?.message||error);
}

async function cloudUpdateBookingStatus(x){
  const {error}=await supabaseClient.from("bookings").update({status:x.status}).eq("id",String(x.id));
  if(error)console.error("Booking status cloud update failed",error);
}

  supabaseClient.channel("blush-polish-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"bookings"},()=>loadCloudData())
    .on("postgres_changes",{event:"*",schema:"public",table:"services"},()=>loadCloudData())
    .on("postgres_changes",{event:"*",schema:"public",table:"categories"},()=>loadCloudData())
    .subscribe();
}

    async function getMyRole(userId){
      const {data,error}=await supabaseClient
        .from("user_roles").select("role").eq("user_id",userId).maybeSingle();
      if(error) throw error;
      return data?.role||null;
    }

    async function requireAdminRole(user){
      const role=await getMyRole(user.id);
      if(!role) return null;
      return role;
    }

    async function loadAdminRoleUsers(){
      const {data,error}=await supabaseClient
        .from("user_roles").select("user_id,role,created_at").order("created_at");
      if(error){console.error("Role list failed",error);return []}
      return data||[];
    }

    async function loadAdminMembers(){
      if(!isFullAdmin())return;
      try{
        const {data,error}=await supabaseClient.functions.invoke("create-admin-user",{body:{action:"list"}});
        if(error)throw error;
        if(!data?.ok)throw new Error(data?.error||"Could not load admin members");
        state.adminMembers=Array.isArray(data.users)?data.users:[];
      }catch(error){
        console.error("Admin member list failed",error);
        state.adminMembers=[];
        toast(error?.message||"Could not load admin members");
      }
    }

async function restoreAdminSession(){
      try{
        const {data,error}=await supabaseClient.auth.getSession();
        if(error)throw error;
        if(data.session?.user){
          const role=await requireAdminRole(data.session.user);
          if(!role){
            await supabaseClient.auth.signOut();
            state.user=null;
            state.page="home";
            state.login=false;
            toast("You are not authorized to access the Admin Portal");
          }else{
            state.user={
              email:data.session.user.email||"",
              role,
              name:data.session.user.user_metadata?.full_name||"Salon Administrator",
              id:data.session.user.id
            };
            state.page="admin";
            state.login=false;
            render();
            loadCloudData();
          }
        }
      }catch(e){console.error("Session restore failed",e)}
      supabaseClient.auth.onAuthStateChange(async (event,session)=>{
        if(session?.user){
          try{
            const role=await requireAdminRole(session.user);
            if(!role){
              await supabaseClient.auth.signOut();
              state.user=null;state.login=false;state.page="home";render();
              toast("You are not authorized to access the Admin Portal");
              return;
            }
            state.user={
              email:session.user.email||"",
              role,
              name:session.user.user_metadata?.full_name||"Salon Administrator",
              id:session.user.id
            };
            if(state.login){state.login=false;state.page="admin";render()}
          }catch(e){console.error("Role check failed",e)}
        }else if(event==="SIGNED_OUT"){
          state.user=null;
          if(state.page==="admin"){state.page="home";state.login=false;render()}
        }
      });
    }

    async function deleteCategory(category){
      if(!isFullAdmin()){toast("Only Admin can delete categories");return}
      const serviceCount=services.filter(service=>service.cat===category).length;
      if(serviceCount){toast(`Move or delete ${serviceCount} service${serviceCount===1?"":"s"} before deleting this category`);return}
      if(!confirm(`Delete the ${category} category permanently?`))return;
      try{
        const {error}=await supabaseClient.from("categories").delete().eq("name",category);
        if(error)throw error;
        const index=cats.indexOf(category);
        if(index>0)cats.splice(index,1);
        localStorage.setItem("blushCategories",JSON.stringify(cats.slice(1)));
        render();
        toast("Category deleted successfully");
      }catch(error){
        console.error("Category delete failed:",error);
        toast(error?.message||"Could not delete category");
      }
    }

    function loginModal(){
    return `<div class="overlay"><div class="modal login-card"><button class="close" onclick="state.login=false;render()">×</button><div class="brand"><img class="brand-mark" src="logo.jpeg" alt="Blush & Polish logo"><div class="brand-copy"><strong>Blush & Polish</strong><span>SECURE LOGIN</span></div></div><h2>Welcome back.</h2><p class="muted">Sign in with your administrator account.</p>
    <form onsubmit="loginSubmit(event)"><div class="field" style="text-align:left"><label>Admin email</label><input id="loginEmail" type="email" placeholder="you@example.com" required></div><div class="field" style="text-align:left"><label>Password</label><input id="loginPass" type="password" placeholder="Password" required></div>${state.loginError?`<div class="login-error">${state.loginError}</div>`:""}<button class="btn btn-primary" style="width:100%;margin-top:8px">Login</button></form>
    </div></div>`;

    async function loginSubmit(e){
      e.preventDefault();
      const email=document.getElementById("loginEmail").value.trim().toLowerCase();
      const pass=document.getElementById("loginPass").value;
      state.loginError="";
      const button=e.target.querySelector("button[type='submit'],button:last-child");
      if(button){button.disabled=true;button.textContent="Signing in…"}
      try{
        const {data,error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
        if(error)throw error;
        if(!data.user)throw new Error("No authenticated user returned");
        const role=await requireAdminRole(data.user);
        if(!role){
          await supabaseClient.auth.signOut();
          state.loginError="This account is not authorized to access the Admin Portal.";
          render();
          return;
        }
        state.user={
          email:data.user.email||email,
          role,
          name:data.user.user_metadata?.full_name||"Salon Administrator",
          id:data.user.id
        };
        state.login=false;
        state.page="admin";
        render();
        loadCloudData();
      }catch(err){
        console.error("Admin login failed",err);
        state.loginError="Invalid admin email or password.";
        render();
      }
    }

    function bookingRows(canManage=true,rows=bookings){

    return `<div class="admin-top"><div><h1>Monthly reports</h1><p style="color:var(--muted)">Track completed salon work and revenue month by month.</p></div><input type="month" value="${month}" onchange="updateReportMonth(this.value)" style="padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff"></div><div class="stat-grid"><div class="stat"><b>${completed.length}</b><span>Completed bookings</span></div><div class="stat"><b>${serviceCount}</b><span>Services done</span></div><div class="stat"><b>${money(revenue)}</b><span>Revenue recorded</span></div><div class="stat"><b>${monthLabel}</b><span>Selected month</span></div></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Booking ID</th><th>Customer</th><th>Services</th><th>Amount</th><th>Date</th></tr></thead><tbody>${completed.length?completed.map(booking=>`<tr><td><b>${booking.id}</b></td><td>${booking.name}</td><td>${booking.services.join(", ")}</td><td>${money(booking.amount)}</td><td>${booking.date}</td></tr>`).join(""):`<tr><td colspan="5"><div class="empty">No completed services recorded for ${monthLabel}.</div></td></tr>`}</tbody></table></div>`;

    } else if(tab==="reports"){

    body=`<div class="admin-top"><div><h1>Admin access</h1><p style="color:var(--muted)">Only users with an Admin or Staff role can access this portal.</p></div>${canManage?'<button class="btn btn-primary" onclick="openAdminMemberModal()">+ Add Admin / Staff</button>':''}</div><div style="background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px"><span class="pill confirmed">${state.user?.role==="admin"?"Admin":"Staff"}</span><h2 style="font:600 34px 'Cormorant Garamond',serif;margin:14px 0 6px">${state.user?.email||"Authenticated user"}</h2><p style="color:var(--muted);line-height:1.7">${canManage?"You have full control. Only you and other authorized Admins can create Admin or Staff accounts.":"You have view-only access. You cannot modify services, categories, bookings, or users."}</p></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th></tr></thead><tbody>${state.adminMembers.length?state.adminMembers.map(member=>`<tr><td><b>${member.name||"User"}</b></td><td>${member.email||""}</td><td><span class="pill ${member.role==="admin"?"confirmed":"active"}">${member.role==="admin"?"Admin":"Staff"}</span></td><td>${member.created_at?new Date(member.created_at).toLocaleDateString("en-IN"):""}</td></tr>`).join(""):`<tr><td colspan="4"><div class="empty">No Admin or Staff accounts found.</div></td></tr>`}</tbody></table></div>`;

    const customerQuery=state.customerSearch.trim().toLowerCase();
    const filteredCustomers=customers.filter(customer=>!customerQuery||customer.name.toLowerCase().includes(customerQuery));
    body=`<div class="admin-top"><div><h1>Customers</h1><p style="color:var(--muted)">Customer details are saved automatically from booking requests.</p></div></div><div style="margin-bottom:18px"><input class="customer-search" style="width:min(520px,100%);padding:13px 16px;border:1px solid var(--line);border-radius:999px;background:#fff" placeholder="Search by customer name..." value="${state.customerSearch.replace(/"/g,"&quot;")}" oninput="updateCustomerSearch(this.value)"></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Customer name</th><th>Mobile number</th><th>Email</th><th>Requested / booked services</th><th>Requests</th><th>Latest status</th></tr></thead><tbody>${filteredCustomers.length?filteredCustomers.map(customer=>`<tr><td><b>${customer.name}</b></td><td>${customer.phone}</td><td>${customer.email||"Not provided"}</td><td>${customer.services.join(", ")}</td><td>${customer.requests}</td><td><span class="pill ${customer.status.toLowerCase()}">${customer.status}</span></td></tr>`).join(""):`<tr><td colspan="6"><div class="empty">${customers.length?"No customers match your search.":"No customer bookings have been saved yet."}</div></td></tr>`}</tbody></table></div>`;
    }
    return `<div class="admin-shell"><aside class="admin-side"><div class="brand"><img class="brand-mark" src="logo.jpeg" alt="Blush & Polish logo"><div class="brand-copy"><strong>Blush & Polish</strong><span style="color:#b7c5ae">ADMIN PANEL</span></div></div><div class="admin-nav">${[["dashboard","Dashboard"],["services","Services"],["categories","Categories"],["bookings","Bookings"],["reports","Reports"],["customers","Customers"]].concat(canManage?[["admins","Admin members"]]:[]).map(x=>`<button class="${tab===x[0]?'active':''}" onclick="state.adminTab='${x[0]}';render();if('${x[0]}'==='admins')loadAdminMembers().then(()=>render())">${x[1]}</button>`).join("")}<button onclick="go('home')">View website</button><button onclick="logout()">Log out</button></div></aside><main class="admin-main">${body}</main></div>`;
    }

    function serviceModal(){
    let editing=state.serviceModal!==null&&state.serviceModal!=="new";let s=editing?svc(state.serviceModal):{name:"",cat:"Facial",price:"",duration:"",desc:"",image:""};
    return `<div class="overlay"><div class="modal"><button class="close" onclick="closeServiceModal()">×</button><span class="pill active">${editing?"Edit service":"Add service"}</span><h2>${editing?"Update":"Create"} service</h2><form onsubmit="saveDemoService(event,${editing?s.id:"null"})"><div class="field"><label>Service name</label><input name="name" value="${s.name}" required></div><div class="form-grid"><div class="field"><label>Category</label><select name="cat">${cats.slice(1).map(c=>`<option ${s.cat===c?"selected":""}>${c}</option>`).join("")}</select></div><div class="field"><label>Price (₹)</label><input name="price" type="number" min="0" value="${s.price}" required></div></div><div class="field"><label>Duration (minutes)</label><input name="duration" type="number" min="1" value="${s.duration}" required></div><div class="field"><label>Service image URL</label><input name="image" type="url" value="${s.image||""}" placeholder="https://example.com/service-photo.jpg"></div><div class="field"><label>Description</label><textarea name="desc" rows="4">${s.desc}</textarea></div><button class="btn btn-primary">${editing?"Save changes":"Add service"}</button></form></div></div>`;
    }
    function categoryModal(){
    const editing=state.categoryModal!==null&&state.categoryModal!=="new", original=editing?decodeURIComponent(state.categoryModal):null;
    return `<div class="overlay"><div class="modal"><button class="close" onclick="closeCategoryModal()">×</button><span class="pill active">${editing?"Edit category":"Add category"}</span><h2>${editing?"Update":"Create"} category</h2><form onsubmit="saveCategory(event,${original===null?"null":`'${original.replace(/'/g,"\\'")}'`})"><div class="field"><label>Category name</label><input name="name" value="${original||""}" required></div><button class="btn btn-primary">${editing?"Save changes":"Add category"}</button></form></div></div>`;
    }
    function adminMemberModal(){
      return `<div class="overlay"><div class="modal"><button class="close" onclick="closeAdminMemberModal()">×</button><span class="pill active">Team access</span><h2>Add Admin / Staff</h2><p class="muted">Only the Admin can create accounts. The new user's password is handled by Supabase Authentication and is never stored in this website.</p><form onsubmit="saveAdminMember(event)"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Temporary password</label><input name="password" type="password" minlength="6" required></div><div class="field"><label>Role</label><select name="role"><option value="staff">Staff - view only</option><option value="admin">Admin - full access</option></select></div><button class="btn btn-primary">Create account</button></form></div></div>`;
    }

    async function saveAdminMember(e){
      if(!isFullAdmin()){toast("Only Admin can manage members");return}
      e.preventDefault();
      const form=e.target;
      const name=form.elements.name.value.trim();
      const email=form.elements.email.value.trim().toLowerCase();
      const password=form.elements.password.value;
      const role=form.elements.role.value;
      const button=form.querySelector("button[type='submit'],button:last-child");
      if(button){button.disabled=true;button.textContent="Creating…"}
      try{
        const {data,error}=await supabaseClient.functions.invoke("create-admin-user",{body:{name,email,password,role}});
        if(error)throw error;
        if(!data?.ok)throw new Error(data?.error||"Could not create account");
        closeAdminMemberModal();
        await loadAdminMembers();
        state.adminTab="admins";
        render();
        toast(`${role==="admin"?"Admin":"Staff"} account created successfully`);
      }catch(err){
        console.error("Create admin/staff failed",err);
        toast(err?.message||"Could not create account");
        if(button){button.disabled=false;button.textContent="Create account"}
      }
    }

    async function deleteAdminMember(userId){
      if(!isFullAdmin()){toast("Only Admin can manage members");return}
      if(userId===state.user?.id){toast("You cannot remove your current account");return}
      toast("User removal will be handled by the secure server function.");
    }


    function saveDemoService(e,id){if(!isFullAdmin()){toast("Only Admin can change services");return}e.preventDefault();const f=e.target;const data={name:f.elements.name.value.trim(),cat:f.elements.cat.value,price:Number(f.elements.price.value),duration:Number(f.elements.duration.value),image:f.elements.image.value.trim(),desc:f.elements.desc.value.trim()};if(id===null){services.push({id:Date.now(),...data});saveServices();closeServiceModal();toast("Service added successfully")}else{Object.assign(svc(id),data);saveServices();closeServiceModal();toast("Service updated successfully")}}
    async function deleteDemoService(id){
      if(!isFullAdmin()){toast("Only Admin can delete services");return}
      if(!confirm("Delete this service permanently?"))return;
      try{
        const {error}=await supabaseClient.from("services").delete().eq("id",Number(id));
        if(error)throw error;
        const i=services.findIndex(s=>Number(s.id)===Number(id));
        if(i>=0)services.splice(i,1);
        localStorage.setItem("blushServices",JSON.stringify(services));
        render();
        toast("Service deleted successfully");
      }catch(error){
        console.error("Service delete failed:",error);
        toast(error?.message||"Could not delete service");
      }
    }

    function render(){
    let content="";
    document.body.className=state.page;
    if(state.page==="admin"){document.body.innerHTML=adminPage()+(state.serviceModal!==null?serviceModal():"")+(state.categoryModal!==null?categoryModal():"")+(state.adminMemberModal?adminMemberModal():"");return}
    document.body.innerHTML=(state.page==="home"||state.page==="services"||state.page==="booking"||state.page==="checkout"||state.page==="confirmation"||state.page==="account")?header():"";
    if(state.page==="home")content=home();
    if(state.page==="services")content=servicesPage();
    if(state.page==="booking")content=bookingPage();
    if(state.page==="checkout")content=checkoutPage();
    if(state.page==="confirmation")content=confirmationPage();
    if(state.page==="account")content=accountPage();
    if(content){document.body.insertAdjacentHTML("beforeend",content);document.body.insertAdjacentHTML("beforeend",`<footer><div class="wrap"><div><img class="brand-mark" src="logo.jpeg" alt="Blush & Polish logo"><strong>Blush & Polish</strong><span>Mogappair, Chennai<br>Hair · Skin · Nail<br><a href="tel:7824952590">7824952590</a><br>@_blush_and_polish_</span></div><div><strong>Navigate</strong><div class="footer-categories"><a onclick="go('home')">Home</a><a onclick="go('services')">Services</a><a onclick="goSection('gallery')">Gallery</a><a onclick="goSection('about')">About</a><a onclick="goSection('contact')">Contact</a></div></div><div><strong>Categories</strong><div class="footer-categories">${cats.slice(1).map(category=>`<a onclick="state.filter=category;go('services')">${category}</a>`).join("")}</div><div style="margin-top:18px"><button onclick="openLogin()" style="border:0;background:none;color:#9fb8ac;font-size:11px;padding:0;cursor:pointer;opacity:.75">Admin Login</button></div></div></div></footer>`)}
    if(state.detail!==null)document.body.insertAdjacentHTML("beforeend",detailModal());
    if(state.login)document.body.insertAdjacentHTML("beforeend",loginModal());
    }
    render();
    loadCloudData();
    startSupabaseRealtime();
    restoreAdminSession();
    </script>
    </body>
    </html>
