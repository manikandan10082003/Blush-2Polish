<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blush & Polish — Hair · Skin · Nail</title>
<meta name="description" content="Blush & Polish salon — hair, skin, nail and bridal beauty services in Mogappair, Chennai.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Italianno&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f5f7f3; --paper:#fffefd; --ink:#1d2024; --olive:#5b9d88; --olive2:#8fd8bf;
  --sage:#d9f1e7; --blush:#f0d8e6; --rose:#c52f69; --gold:#c28a42; --gold2:#e8bd68;
  --coral:#d8326c; --teal:#277d70; --lavender:#d9d2ed;
  --line:#cbd8d1; --dark:#111418; --muted:#68716d; --white:#fff;
  --shadow:0 18px 55px rgba(0,0,0,.3); --radius:24px;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit} button{cursor:pointer}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
.topbar{background:var(--dark);color:var(--olive2);font-size:12px;letter-spacing:.12em;text-align:center;padding:9px}
.site-header{position:sticky;top:0;z-index:50;background:rgba(255,254,253,.96);backdrop-filter:blur(18px);border-bottom:2px solid var(--olive2)}
.site-header .wrap{width:100%;max-width:none;padding:0 30px}
.header-row{min-height:78px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:30px}
.header-row .brand{justify-self:start}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand-mark{width:58px;height:58px;object-fit:cover;border:2px solid var(--ink);border-radius:50%;background:var(--sage);box-shadow:0 4px 14px rgba(29,32,36,.16)}
.brand-copy strong{display:block;font:600 34px/1 "Cormorant Garamond",serif;letter-spacing:.01em}
.brand-copy span{display:block;font-size:10px;letter-spacing:.36em;margin-top:5px;color:var(--olive)}
.nav{display:flex;justify-content:center;gap:clamp(22px,3.5vw,48px);align-items:center;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.header-row .nav{justify-self:stretch}
.nav a{cursor:pointer}
.nav a:hover,.nav a.active{color:var(--rose)}
.header-actions{display:flex;align-items:center;gap:10px}
.header-row .header-actions{justify-self:end}
.cart-text{border:2px solid var(--teal);background:var(--sage);color:var(--ink);font-size:14px;font-weight:700;padding:0;border-radius:999px;transition:.2s;width:112px;height:44px;display:inline-flex;align-items:center;justify-content:center}
.cart-text:hover{background:var(--teal);color:#fff;transform:translateY(-2px)}
.icon-btn{border:1px solid var(--line);background:var(--paper);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.cart-badge{position:absolute;margin:-30px 0 0 25px;background:var(--rose);color:white;border-radius:99px;font-size:10px;min-width:19px;height:19px;display:grid;place-items:center}
.btn{border:0;border-radius:999px;padding:13px 20px;font-weight:700;letter-spacing:.03em;transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--teal);color:white;box-shadow:0 9px 22px rgba(40,127,123,.25)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff}
.btn-soft{background:var(--sage);color:var(--teal)}
.btn-outline{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.9);color:#fff}
.btn-danger{background:#8f4b45;color:#fff}
.btn-book{background:var(--coral);color:#fff;box-shadow:0 9px 22px rgba(200,47,105,.25)}
.header-actions .btn-book{width:112px;height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.hamb{display:none}

.hero{min-height:690px;position:relative;overflow:hidden;background:
linear-gradient(110deg,rgba(17,20,24,.78),rgba(91,157,136,.45) 48%,rgba(240,216,230,.36)),
url("https://static.vecteezy.com/system/resources/thumbnails/056/367/873/small/a-close-up-portrait-of-a-young-woman-with-bright-pink-hair-she-is-wearing-a-red-jacket-and-has-a-serious-expression-on-her-face-photo.jpeg") center/cover;animation:hero-pan 14s ease-in-out infinite alternate}
.hero:before{content:"";position:absolute;inset:-12%;background:linear-gradient(125deg,rgba(143,216,191,.3),transparent 38%,rgba(240,216,230,.24) 72%,rgba(197,47,105,.16));mix-blend-mode:screen;animation:hero-glow 9s ease-in-out infinite alternate;pointer-events:none}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 70%,var(--cream))}
.hero-inner{position:relative;z-index:2;min-height:690px;display:flex;align-items:center}
.hero-copy{width:min(650px);color:white;padding:60px 0;animation:hero-copy-in 1s ease-out both}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.28em;color:var(--gold2);font-weight:700}
.hero h1{font:600 clamp(58px,8vw,104px)/.82 "Cormorant Garamond",serif;margin:22px 0}
.hero h1 em{font-family:"Italianno",cursive;font-style:normal;color:#e5cfa0;font-size:.68em}
.hero p{max-width:560px;font-size:19px;line-height:1.85;color:#f6f0e6}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;animation:hero-rise .8s .45s ease-out both}
.hero-actions .btn{animation:button-float 3.5s 1.4s ease-in-out infinite}
.hero-actions .btn:nth-child(2){animation-delay:1.7s}
.hero .btn-primary{background:#fff;color:var(--ink)}
.hero-note{display:flex;gap:20px;flex-wrap:wrap;margin-top:35px;font-size:12px;letter-spacing:.08em;color:#eee7d8}
.hero-note span{display:flex;gap:8px;align-items:center}.hero-note{animation:hero-rise .8s .7s ease-out both}.dot{width:6px;height:6px;border-radius:50%;background:var(--gold2);animation:dot-pulse 2s ease-in-out infinite}
@keyframes hero-copy-in{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes hero-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes button-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes dot-pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,195,109,.35)}50%{box-shadow:0 0 0 7px rgba(242,195,109,0)}}
@keyframes hero-pan{from{background-position:48% 50%;}to{background-position:54% 46%;}}
@keyframes hero-glow{from{transform:translate3d(-2%,0,0) scale(1);}to{transform:translate3d(2%,1%,0) scale(1.05);}}

.section{padding:90px 0}.section-head{text-align:center;max-width:760px;margin:0 auto 45px}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.28em;color:var(--rose);font-weight:800}
.section h2{font:600 clamp(44px,5.6vw,70px)/.96 "Cormorant Garamond",serif;margin:14px 0 18px;letter-spacing:-.015em}
.section-head p{color:var(--muted);line-height:1.85;margin:0;font-size:17px}
.feature-grid{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:18px}
.feature{position:relative;min-height:310px;border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.feature img{width:100%;height:100%;object-fit:cover;transition:.5s}.feature:hover img{transform:scale(1.05)}
.feature:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(18,28,18,.78))}
.feature-content{position:absolute;z-index:2;left:25px;right:25px;bottom:23px;color:white}
.feature-content h3{font:600 34px "Cormorant Garamond",serif;margin:0 0 6px}.feature-content p{font-size:12px;opacity:.9}

.brand-strip{background:var(--ink);color:#eee8d8;padding:24px 0}.brand-strip .wrap{display:flex;justify-content:center;gap:35px;flex-wrap:wrap;letter-spacing:.22em;font-size:11px;text-transform:uppercase}.brand-strip span:before{content:"✦";color:var(--gold2);margin-right:10px}

.services-section{background:linear-gradient(135deg,#e9f7f1 0%,#f7f4f0 52%,#f5e4ed 100%)}
.filterbar{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-bottom:32px}
.filter{padding:11px 17px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--muted);font-weight:600}
.filter.active{background:var(--coral);color:white;border-color:var(--coral)}
.service-grid{display:grid;grid-template-columns:repeat(3,minmax(280px,360px));justify-content:center;gap:22px;width:100%}
.inner-page-wrap{width:calc(100% - 32px);max-width:none}
.service-card{position:relative;background:var(--ink);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:430px;box-shadow:0 8px 28px rgba(44,52,37,.06);transition:.25s}
.service-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.service-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#f4f0e5;transition:.5s}
.service-card:hover .service-image{transform:scale(1.04)}
.service-card:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 28%,rgba(0,0,0,.88) 100%);pointer-events:none}
.service-card-body{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;flex:1;min-height:430px;padding:24px 18px 18px;color:#fff}
.service-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.service-card h3{font:600 27px/1.02 "Cormorant Garamond",serif;margin:13px 0 7px;color:#fff}
.service-card p{font-size:13px;color:#f2eee4;line-height:1.58;margin:0 0 12px}
.service-price{font-weight:800;font-size:20px;color:#f3d99d}
.service-price small{font-size:10px;font-weight:600;color:#f2eee4}
.service-actions .btn-primary{background:var(--coral);box-shadow:0 8px 18px rgba(232,111,97,.3)}
.service-actions{display:flex;gap:8px;margin-top:12px}.service-actions .btn{padding:10px 13px;font-size:12px;flex:1}

.catalog-banner{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.catalog-banner img{height:430px;width:100%;object-fit:cover;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow)}
.catalog-note{grid-column:1/-1;text-align:center;color:var(--muted);font-size:12px}

.service-showcase{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:38px}.service-showcase-card{position:relative;min-height:170px;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 30px rgba(44,52,37,.08);cursor:pointer}.service-showcase-card img{width:100%;height:100%;object-fit:cover;transition:.45s}.service-showcase-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,32,24,.03),rgba(24,32,24,.82))}.service-showcase-card:hover img{transform:scale(1.06)}.service-showcase-copy{position:absolute;z-index:2;left:18px;right:18px;bottom:16px;color:#fff}.service-showcase-copy h3{font:600 27px/1 "Cormorant Garamond",serif;margin:0 0 4px}.service-showcase-copy span{font-size:11px;letter-spacing:.08em;opacity:.88}.service-more{display:flex;justify-content:center;margin-top:28px}.color-band{background:linear-gradient(110deg,#253b52 0%,#543456 48%,#6a3d46 100%);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;background:linear-gradient(135deg,#e1f5ec,#f3e5ed);}
.about-photo{position:relative}.about-photo img{height:600px;width:100%;object-fit:cover;border-radius:30px;box-shadow:var(--shadow)}
.about-photo .floating{position:absolute;right:-25px;bottom:30px;background:#fffdf8;border:1px solid var(--line);padding:20px 24px;border-radius:20px;box-shadow:var(--shadow)}
.about h2{text-align:left}.about-copy p{line-height:1.85;color:var(--muted)}
.about-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}.about-list div{padding:14px;background:#fff;border:1px solid var(--line);border-radius:15px;font-size:13px}.about-list b{display:block;color:var(--olive);margin-bottom:4px}

.gallery{display:grid;grid-template-columns:1.2fr .8fr .8fr;grid-auto-rows:220px;gap:14px}
.gallery img{width:100%;height:100%;object-fit:cover;border-radius:20px}.gallery .tall{grid-row:span 2}.gallery .wide{grid-column:span 2}

.contact{background:var(--dark);color:#fff}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}.contact .section-head{text-align:left;margin:0}.contact p{color:#d4ddd8}.contact-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.contact-card{padding:18px;border:1px solid rgba(143,216,191,.28);border-radius:18px;background:rgba(143,216,191,.08)}.contact-card small{color:var(--olive2);display:block;margin-bottom:5px}.contact-card a{color:var(--blush)}
.contact-form{margin-top:28px}.contact-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.contact-form .field{margin:0 0 12px}.contact-form .field label{color:var(--olive2)}.contact-form input,.contact-form select,.contact-form textarea{background:rgba(255,255,255,.96);color:var(--ink);border:1px solid var(--olive2)}.contact-form button{margin-top:6px}
.map-card{min-height:360px;border-radius:26px;overflow:hidden;background:var(--sage) url("https://staticmap.openstreetmap.de/staticmap.php?center=13.0427,80.1719&zoom=14&size=800x500&maptype=mapnik") center/cover;position:relative;border:1px solid var(--olive2)}
.map-card:after{content:"Mogappair, Chennai";position:absolute;left:22px;bottom:22px;background:#fff;color:var(--ink);padding:12px 16px;border-radius:12px;font-weight:700;box-shadow:var(--shadow)}

body.home{background:linear-gradient(145deg,#f5f7f3 0%,#e8f6ef 48%,#f5e6ed 100%)}
body.home>.section{position:relative;overflow:hidden}
body.home>.section:nth-of-type(2){background:linear-gradient(135deg,#f8fbf8 0%,#dff4e9 48%,#f4e3eb 100%)}
body.home>#about{background:linear-gradient(120deg,#dff5eb 0%,#f5f8f4 50%,#f4dce7 100%)}
body.home>#gallery{background:linear-gradient(135deg,#f5f8f4 0%,#f6e0e8 48%,#dff3ea 100%)}
body.home .about{background:transparent}
body.home .section-head p{color:#48566f}
body.home .brand-strip{background:linear-gradient(90deg,#20302b,#5b9d88,#c52f69)}
.color-band{background:linear-gradient(110deg,#ccefe0 0%,#f3e4ec 52%,#dff4ec 100%)}
.map-card{background-color:var(--sage)}
.service-more .btn-gold{background:var(--coral);color:#fff;box-shadow:0 9px 22px rgba(200,47,105,.24)}

.contact-links{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.contact-links h3{grid-column:1/-1;margin:0;color:var(--olive2);font:600 27px "Cormorant Garamond",serif}.contact-links a,.contact-links button{color:#fff;background:transparent;border:0;text-align:left;font-size:14px;padding:0}.contact-links a:hover,.contact-links button:hover{color:var(--olive2)}
footer{padding:38px 0;background:var(--dark);color:#d4ddd8;font-size:14px}footer .wrap{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:28px;align-items:start}footer strong{display:block;color:var(--olive2);font:600 26px "Cormorant Garamond",serif;margin-bottom:10px}footer span,footer a{line-height:1.8}footer .footer-categories{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}footer .footer-categories a:hover{color:var(--rose)}

.overlay{position:fixed;inset:0;background:rgba(15,21,15,.58);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--paper);width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:26px;box-shadow:0 30px 100px rgba(0,0,0,.3);padding:30px;position:relative}
.close{position:absolute;right:18px;top:18px;border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:50%}
.modal h2{font:600 42px "Cormorant Garamond",serif;margin:0 0 8px}.modal .muted{color:var(--muted);line-height:1.7}
.detail-price{font-size:28px;color:var(--olive);font-weight:800;margin:20px 0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:12px 0}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--olive)}
.login-card{width:min(480px,100%);text-align:center}.login-card .brand{justify-content:center;margin-bottom:18px}.role-note{background:var(--sage);padding:12px;border-radius:12px;color:var(--ink);font-size:12px;margin:15px 0}.login-error{color:#a24f48;font-size:12px;margin:8px 0}
.cart-drawer{position:fixed;right:0;top:0;bottom:0;width:min(430px,100%);background:var(--paper);z-index:120;box-shadow:-20px 0 70px rgba(0,0,0,.2);padding:25px;overflow:auto}.cart-head{display:flex;justify-content:space-between;align-items:center}.cart-head h2{font:600 38px "Cormorant Garamond",serif;margin:0}.cart-item{display:flex;justify-content:space-between;gap:15px;padding:16px 0;border-bottom:1px solid var(--line)}.cart-item small{display:block;color:var(--muted);margin-top:4px}.cart-total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:22px 0}

.admin-shell{min-height:100vh;background:#f2f1ea;display:grid;grid-template-columns:245px 1fr}.admin-side{background:#1c2b1c;color:white;padding:25px 16px;position:sticky;top:0;height:100vh}.admin-side .brand-copy strong{font-size:25px}.admin-nav{margin-top:30px;display:grid;gap:6px}.admin-nav button{background:transparent;border:0;color:#d8dfd3;text-align:left;padding:13px 15px;border-radius:12px}.admin-nav button.active,.admin-nav button:hover{background:#334b31;color:white}.admin-main{padding:35px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.admin-top h1{font:600 48px "Cormorant Garamond",serif;margin:0}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat b{font-size:30px;color:var(--olive);display:block}.stat span{font-size:12px;color:var(--muted)}
.admin-table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px}.admin-table{width:100%;border-collapse:collapse;min-width:800px}.admin-table th,.admin-table td{padding:14px 16px;border-bottom:1px solid #ece8da;text-align:left;font-size:12px}.admin-table th{background:#f8f5eb;text-transform:uppercase;letter-spacing:.08em;font-size:10px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:700}.pill.active,.pill.paid,.pill.confirmed{background:#dfead8;color:#35502d}.pill.pending{background:#f3e6c6;color:#775f27}.pill.inactive,.pill.cancelled{background:#f2d9d6;color:#7b403b}.actions{display:flex;gap:8px}.link-btn{border:0;background:none;color:var(--olive);font-size:12px}.link-btn.danger{color:#a24f48}
.admin-table td small{display:block;color:var(--muted);margin-top:4px;line-height:1.5}.admin-table td select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}.pill.completed{background:#dfead8;color:#35502d}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:300;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;box-shadow:var(--shadow);font-size:12px}
.empty{text-align:center;padding:40px;color:var(--muted)}
.user-bar{background:#edf1e7;border-bottom:1px solid var(--line);padding:10px 0;font-size:12px}.user-bar .wrap{display:flex;justify-content:flex-end;gap:12px;align-items:center}.logout{border:0;background:none;color:var(--rose);font-weight:700}

@media(max-width:900px){
 .nav{display:none}.nav.mobile-show{display:flex;position:absolute;left:20px;right:20px;top:calc(100% + 1px);padding:18px;flex-direction:column;align-items:flex-start;gap:16px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}.hamb{display:grid}.hero,.hero-inner{min-height:610px}.hero-copy{padding:35px 0}
 .feature-grid,.service-grid,.catalog-banner,.about,.contact-grid,.service-showcase{grid-template-columns:1fr 1fr}
 .feature:first-child{grid-column:1/-1}.catalog-banner img{height:320px}
 .gallery{grid-template-columns:1fr 1fr}.gallery .wide{grid-column:span 2}.about-photo img{height:450px}
 .admin-shell{grid-template-columns:1fr}.admin-side{position:relative;height:auto}.admin-nav{grid-template-columns:repeat(3,1fr)}.admin-main{padding:22px}.stat-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){
 .wrap{width:min(100% - 26px,1180px)}.header-row{min-height:68px}.brand-copy strong{font-size:24px}.brand-copy span{font-size:8px}
 .hero h1{font-size:60px}.hero{min-height:640px}.hero-inner{min-height:640px}.hero p{font-size:14px}
 .section{padding:65px 0}.feature-grid,.service-grid,.catalog-banner,.about,.contact-grid,.contact-cards,.form-grid,.service-showcase{grid-template-columns:1fr}

function money(n){return "₹"+Number(n).toLocaleString("en-IN")}

function toast(msg){const e=document.createElement("div");e.className="toast";e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function go(page){state.page=page;state.login=false;window.scrollTo({top:0,behavior:"smooth"});render()}

function toggleMobileNav(){document.querySelector(".nav")?.classList.toggle("mobile-show")}
function openLogin(){state.login=true;state.loginError="";render()}
function logout(){state.user=null;state.page="home";toast("Logged out");render()}
function addCart(id){if(!state.cart.includes(id)){state.cart.push(id);render();toast("Service added to cart successfully");}else toast("This service is already in your cart")}
function removeCart(id){state.cart=state.cart.filter(x=>x!==id);render()}

function closeCategoryModal(){state.categoryModal=null;render()}
function deleteCategory(category){if(!isFullAdmin()){toast("Only Admin can delete categories");return}const serviceCount=services.filter(service=>service.cat===category).length;if(serviceCount){toast(`Move or delete ${serviceCount} service${serviceCount===1?"":"s"} before deleting this category`);return}if(confirm(`Delete the ${category} category?`)){const index=cats.indexOf(category);if(index>0){cats.splice(index,1);saveCategories();render();toast("Category deleted successfully")}}}
function saveCategory(e,original){if(!isFullAdmin()){toast("Only Admin can change categories");return}e.preventDefault();const name=e.target.elements.name.value.trim();if(!name){toast("Enter a category name");return}if(cats.some(category=>category.toLowerCase()===name.toLowerCase()&&category!==original)){toast("That category already exists");return}if(original===null){cats.push(name);toast("Category added successfully")}else{const index=cats.indexOf(original);if(index>0){cats[index]=name;services.forEach(service=>{if(service.cat===original)service.cat=name});toast("Category updated successfully")}}saveCategories();saveServices();closeCategoryModal()}

function contactSubmit(e){e.preventDefault();const form=e.target;const name=form.elements.name.value.trim(),phone=form.elements.phone.value.trim(),email=form.elements.email.value.trim(),service=form.elements.service.value,notes=form.elements.notes.value.trim();if(!name||!phone){toast("Please enter your name and phone");return}openWhatsApp(`Hello Blush & Polish, I would like to make an enquiry.\n\nName: ${name}\nPhone: ${phone}\nEmail: ${email||"Not provided"}\nService: ${service||"General enquiry"}\nMessage: ${notes||"No additional message"}`);toast("WhatsApp opened with your enquiry")}

function deleteAdminMember(email){if(adminUsers.length===1){toast("Keep at least one admin account");return}if(email===state.user?.email){toast("You cannot remove your current account");return}if(confirm("Remove this admin member?")){const index=adminUsers.findIndex(admin=>admin.email===email);if(index>=0){adminUsers.splice(index,1);saveAdmins();render();toast("Admin member removed")}}}

function serviceModal(){
 let editing=state.serviceModal!==null&&state.serviceModal!=="new";let s=editing?svc(state.serviceModal):{name:"",cat:"Facial",price:"",duration:"",desc:"",image:""};
 return `<div class="overlay"><div class="modal"><button class="close" onclick="closeServiceModal()">×</button><span class="pill active">${editing?"Edit service":"Add service"}</span><h2>${editing?"Update":"Create"} service</h2><form onsubmit="saveDemoService(event,${editing?s.id:"null"})"><div class="field"><label>Service name</label><input name="name" value="${s.name}" required></div><div class="form-grid"><div class="field"><label>Category</label><select name="cat">${cats.slice(1).map(c=>`<option ${s.cat===c?"selected":""}>${c}</option>`).join("")}</select></div><div class="field"><label>Price (₹)</label><input name="price" type="number" min="0" value="${s.price}" required></div></div><div class="field"><label>Duration (minutes)</label><input name="duration" type="number" min="1" value="${s.duration}" required></div><div class="field"><label>Service image URL</label><input name="image" type="url" value="${s.image||""}" placeholder="https://example.com/service-photo.jpg"></div><div class="field"><label>Description</label><textarea name="desc" rows="4">${s.desc}</textarea></div><button class="btn btn-primary">${editing?"Save changes":"Add service"}</button></form></div></div>`;
}
function categoryModal(){
 const editing=state.categoryModal!==null&&state.categoryModal!=="new", original=editing?decodeURIComponent(state.categoryModal):null;
 return `<div class="overlay"><div class="modal"><button class="close" onclick="closeCategoryModal()">×</button><span class="pill active">${editing?"Edit category":"Add category"}</span><h2>${editing?"Update":"Create"} category</h2><form onsubmit="saveCategory(event,${original===null?"null":`'${original.replace(/'/g,"\\'")}'`})"><div class="field"><label>Category name</label><input name="name" value="${original||""}" required></div><button class="btn btn-primary">${editing?"Save changes":"Add category"}</button></form></div></div>`;
}
function adminMemberModal(){
 return `<div class="overlay"><div class="modal"><button class="close" onclick="closeAdminMemberModal()">×</button><span class="pill active">Team access</span><h2>Add team member</h2><p class="muted">Admins can manage everything. Staff can view services, categories, requests, and customer details.</p><form onsubmit="saveAdminMember(event)"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="6" required></div><div class="field"><label>Role</label><select name="role"><option value="staff">Staff - view only</option><option value="admin">Admin - full access</option></select></div><button class="btn btn-primary">Add team member</button></form></div></div>`;
}
function saveDemoService(e,id){if(!isFullAdmin()){toast("Only Admin can change services");return}e.preventDefault();const f=e.target;const data={name:f.elements.name.value.trim(),cat:f.elements.cat.value,price:Number(f.elements.price.value),duration:Number(f.elements.duration.value),image:f.elements.image.value.trim(),desc:f.elements.desc.value.trim()};if(id===null){services.push({id:Date.now(),...data});saveServices();closeServiceModal();toast("Service added successfully")}else{Object.assign(svc(id),data);saveServices();closeServiceModal();toast("Service updated successfully")}}
function deleteDemoService(id){if(!isFullAdmin()){toast("Only Admin can delete services");return}if(confirm("Delete this demo service?")){const i=services.findIndex(s=>s.id===id);if(i>=0)services.splice(i,1);saveServices();render();toast("Service deleted")}}

function render(){
 let content="";
 document.body.className=state.page;
 if(state.page==="admin"){document.body.innerHTML=adminPage()+(state.serviceModal!==null?serviceModal():"")+(state.categoryModal!==null?categoryModal():"")+(state.adminMemberModal?adminMemberModal():"");return}
 document.body.innerHTML=(state.page==="home"||state.page==="services"||state.page==="booking"||state.page==="checkout"||state.page==="confirmation"||state.page==="account")?header():"";
 if(state.page==="home")content=home();
 if(state.page==="services")content=servicesPage();
 if(state.page==="booking")content=bookingPage();
 if(state.page==="checkout")content=checkoutPage();
 if(state.page==="confirmation")content=confirmationPage();
 if(state.page==="account")content=accountPage();
 if(content){document.body.insertAdjacentHTML("beforeend",content);document.body.insertAdjacentHTML("beforeend",`<footer><div class="wrap"><div><img class="brand-mark" src="logo.jpeg" alt="Blush & Polish logo"><strong>Blush & Polish</strong><span>Mogappair, Chennai<br>Hair · Skin · Nail<br><a href="tel:7824952590">7824952590</a><br>@_blush_and_polish_</span></div><div><strong>Navigate</strong><div class="footer-categories"><a onclick="go('home')">Home</a><a onclick="go('services')">Services</a><a onclick="goSection('gallery')">Gallery</a><a onclick="goSection('about')">About</a><a onclick="goSection('contact')">Contact</a></div></div><div><strong>Categories</strong><div class="footer-categories">${cats.slice(1).map(category=>`<a onclick="state.filter=category;go('services')">${category}</a>`).join("")}</div><div style="margin-top:18px"><button onclick="openLogin()" style="border:0;background:none;color:#9fb8ac;font-size:11px;padding:0;cursor:pointer;opacity:.75">Admin Login</button></div></div></div></footer>`)}
 if(state.detail!==null)document.body.insertAdjacentHTML("beforeend",detailModal());
 if(state.login)document.body.insertAdjacentHTML("beforeend",loginModal());
}
render();
</script>
</body>
</html>
